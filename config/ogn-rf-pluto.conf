// ogn-rf configuration for an ADALM-PLUTO on the European OGN channels
//
// Every key below is one that ogn-rf.cc actually looks up, except where it is marked "(branch)" -
// those are added by the adalm-pluto branch and are ignored by a binary that does not have it.
// That distinction matters: libconfig silently ignores a mistyped key and ogn-rf falls back to its
// built-in default with no warning at all.
//
// Differences from an RTL-SDR configuration, all of them forced by the hardware:
//
//  * RF.DeviceType selects the backend. "pluto" requires a binary built with USE_PLUTOSDR=1; without
//    it the request falls back to RTL-SDR and says so at open time.
//
//  * RF.SampleRate is 2000000 and not the RTL-SDR 2048000. The AD9363 cannot produce a rate below
//    about 2.08 MSPS, so the backend runs the chip faster and decimates in software to exactly what
//    is asked for here. 2.0 MSPS is the same figure the RSPduo work settled on, which keeps the
//    frequency plan and the gain measurements comparable. See docs/hardware.md.
//
//  * RF.FreqCorr is applied as an offset on the LO, because the AD9363 has no ppm register. It is
//    still a real correction, not a software shift - but unlike the RSPduo the number is our own
//    arithmetic, so measure it with gsm_scan before trusting it.
//
//  * RF.BiasTee and RF.OfsTune are accepted and IGNORED. The Pluto has no bias tee (it is a
//    transceiver on a bare board, with no antenna switch or LNA supply) and no offset-tuning mode.
//
//  * RF.DeviceUri (branch) chooses the libiio context: "usb:<bus>.<port>" for USB, or
//    "ip:192.168.2.1" to go over the network gadget instead.
//
// Note: libconfig has no "outer braces" form - the settings start at the top level.

RF = {
  DeviceType = "pluto";
  Device     = 0;                 // enumeration index; prefer DeviceUri once the port is known
  DeviceUri  = "usb:1.4.4.3";     // (branch) the port the radio was last seen on. Confirm with
                                  // ./scripts/probe-pluto.sh: the port changes if it is replugged.

  FreqPlan   = 1;                 // Europe/Africa: hops between 868.200 and 868.400 MHz
  FreqRaster = 1;                 // [Hz] no rounding; the AD9363 tunes to well under 1 Hz
  FreqCorr   = 0;                 // [ppm] our own LO offset; measure with gsm_scan first
  SampleRate = 2000000;           // [Hz] what the backend decimates TO - see the header note
  BiasTee    = 0;                 // accepted and ignored: the Pluto has no bias tee
  OfsTune    = 0;                 // accepted and ignored: no offset-tuning mode

  // The chip rate the backend asks the AD9363 for before decimating. 4.0 MSPS halves to exactly
  // 2.0 MSPS and keeps USB traffic at 16 MB/s, about a quarter of what a 480 Mbit/s bus carries.
  // 8.0 MSPS is the alternative if the decimation turns out to alias; it doubles the USB load.
  //
  // NOT YET READ BY THE BINARY - this is the branch's key, recorded here so the intent survives.
  Pluto = {
    ChipRate = 4000000;
    // The libiio context timeout, in ms. A USB refill that times out should be retried, not treated
    // as a dead device, so this is generous.
    Timeout  = 3000;
  };

  OGN = {
    // [dB] total receive gain. NO FIGURE HERE IS MEASURED YET, WHICH IS WHY THIS VALUE IS MARKED.
    //
    // On the AD9363 the gain is a single hardwaregain attribute in manual mode, with a range and a
    // step reported by the device rather than documented anywhere trustworthy. Read them with:
    //     ./scripts/probe-pluto.sh --capture -v
    // and then sweep to find the law, the way the RSPduo work found "total = 115.8 - gRdB":
    //
    //     for g in 0 10 20 30 40 50 60; do ./scripts/probe-pluto.sh --capture -g $g -n 500000; done
    //
    // The right setting is the one where the noise floor sits near 20-25 % of full scale with a
    // crest factor around 9-11, and where raising the gain further starts to collapse the crest
    // factor toward 3-5 - that collapse is impulsive peaks folding, and it destroys the OGN pulses.
    // 40 dB is a starting guess chosen to be obviously too low or too high, not a recommendation.
    Gain     = 40.0;
    GainMode = 1;                 // 1 = manual gain, as ogn-rf requires
    // How much of each second is read. The default leaves room for the demodulator; raise SensTime
    // only if ogn-rf prints "Half time slot".
    SensTime  = 0.850;            // [sec]
    StartTime = 0.375;            // [sec] offset into the time slot at which reading begins
  };
};

// Receiver identity. APRS.Call becomes the prefix of any recorded file, and is what the OGN
// network knows the station by, so set it to the callsign OGN assigned to this receiver.
APRS = {
  Call = "PlutoSDR";
};

// Position, in degrees; positive is north and east. ogn-rf uses this to pick a hopping plan when
// RF.FreqPlan is left at 0. With an explicit FreqPlan above it is informational, but keep it
// right: it is embedded in the data the receiver reports.
Position = {
  Latitude  =  52.000000;
  Longitude =   0.000000;
};

// The HTTP status page. This is the quickest way to see whether the receiver is healthy, and it is
// where the radio's own name appears - it should read "PlutoSDR" once the backend is in.
HTTP = {
  Port = 8095;
};

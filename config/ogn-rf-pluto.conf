// ogn-rf configuration for an ADALM-PLUTO on the European OGN channels
//
// Every key below is one that ogn-rf.cc actually looks up, except where it is marked "(branch)" -
// those are added by the adalm-pluto branch and are ignored by a binary that does not have it.
// That distinction matters: libconfig silently ignores a mistyped key and ogn-rf falls back to its
// built-in default with no warning at all.
//
// Differences from an RTL-SDR configuration, all of them forced by the hardware:
//
//  * RF.DeviceType selects the backend. "pluto" requires a binary built with USE_PLUTOSDR=1; without
//    it the request falls back to RTL-SDR and says so at open time.
//
//  * RF.SampleRate is 2000000, and the CHIP PRODUCES EXACTLY THAT - no software resampling. Plain
//    writes to sampling_frequency bottom out at 2083333 Hz, but ad9361_set_bb_rate() loads an RX FIR
//    with decimation and reaches 1999999 Hz. Exactly 2.000 MSPS matters because Inp_FFT computes
//    FFTsize=(8*8*SampleRate)/15625: 8192 (a power of two) at 2.000, versus 8533 = 7*23*53 at 2.083,
//    which FFTW runs through generic codelets. See docs/hardware.md.
//
//  * RF.FreqCorr is a REAL hardware trim, not a software offset. The AD9363 exposes xo_correction
//    (measured: 39999890 Hz, range 39991891..40007889), i.e. +-200 ppm at 1 Hz resolution on a
//    40 MHz XO, so 1 ppm = 40 Hz. (An earlier version of this file claimed the chip had no ppm
//    control and that the correction would be arithmetic on the LO. That was wrong.)
//
//  * RF.BiasTee and RF.OfsTune are accepted and IGNORED. The Pluto has no bias tee (it is a
//    transceiver on a bare board, with no antenna switch or LNA supply) and no offset-tuning mode.
//
//  * RF.DeviceUri (branch) chooses the libiio context: "usb:<bus>.<port>" for USB, or
//    "ip:192.168.2.1" to go over the network gadget instead.
//
// Note: libconfig has no "outer braces" form - the settings start at the top level.

RF = {
  DeviceType = "pluto";
  Device     = 0;                 // enumeration index; ignore it once DeviceSerial is set
//DeviceUri  = "usb:1.32.5";      // (branch) a libiio URI. DO NOT PIN THIS - see below.
  // The libiio USB URI is usb:<bus>.<address>.<interface>, and the ADDRESS CHANGES ON EVERY REPLUG
  // (it was 30, then 31, then 32 during the bring-up, with the IIO function always on interface 5).
  // A pinned URI works exactly once. Select the radio by serial instead, which is stable across
  // everything:
  DeviceSerial = "104473ae73930001fdff27009d682d6d06";

  FreqPlan   = 1;                 // Europe/Africa: hops between 868.200 and 868.400 MHz
  FreqRaster = 1;                 // [Hz] no rounding; the AD9363 tunes to well under 1 Hz
  FreqCorr   = 0;                 // [ppm] our own LO offset; measure with gsm_scan first
  SampleRate = 2000000;           // [Hz] produced by the chip itself via ad9361_set_bb_rate(2000000)
  BiasTee    = 0;                 // accepted and ignored: the Pluto has no bias tee
  OfsTune    = 0;                 // accepted and ignored: no offset-tuning mode

  // The chip rate the backend asks the AD9363 for before decimating. 4.0 MSPS halves to exactly
  // 2.0 MSPS and keeps USB traffic at 16 MB/s, about a quarter of what a 480 Mbit/s bus carries.
  // 8.0 MSPS is the alternative if the decimation turns out to alias; it doubles the USB load.
  //
  // NOT YET READ BY THE BINARY - this is the branch's key, recorded here so the intent survives.
  Pluto = {
    // THE CHIP DOES ALL THE DECIMATION. ad9361_set_bb_rate() designs and loads an RX FIR, which is
    // the only way below 2083333 Hz: the plain sampling_frequency attribute bottoms out there
    // because the HB stages alone run out of decimation. Measured on this board:
    //
    //     ad9361_set_bb_rate(1000000) -> 999999 Hz   ADC 32 MHz, HB /2 /2, FIR /4
    //     ad9361_set_bb_rate(2000000) -> 1999999 Hz  ADC 64 MHz, HB /2 /2, FIR /4   <- this
    //
    // So the converter runs at 64 MHz, every decimation stage is on-chip, USB carries 8 MB/s, and
    // no software resampling happens at all. (Writing sampling_frequency cannot do this, and an
    // earlier version of this file wrongly concluded that 2.0 MSPS was impossible.)
    //
    // The backend must call ad9361_set_bb_rate() - it is in libad9361, present on this board - and
    // must NOT additionally write sampling_frequency afterwards, which would undo the FIR setup.
    BbRate   = 2000000;

    // The analogue filter. ad9361_set_bb_rate() picks 1 MHz on its own if left alone; 4 MHz is
    // better. Measured at 100 MHz FM, 2 MSPS, gain 73 dB:
    //
    //     1 MHz -> rms  8.8 %FS     4 MHz -> rms 11.5 %FS   <- this
    //     2 MHz -> rms 11.1 %FS     8 MHz -> rms 11.5 %FS
    //                              18 MHz -> rms  9.0 %FS
    //                              56 MHz -> rms  6.5 %FS
    //
    // Roughly twice the output rate is the peak: a wider analogue filter loses signal here rather
    // than preserving it, so a config that sets the bandwidth wide "to encourage a high sample rate"
    // costs about 5 dB for nothing, because the ADC already runs at 64 MHz.
    Bandwidth = 4000000;

    // The libiio context timeout, in ms. A USB refill that times out should be retried, not treated
    // as a dead device, so this is generous.
    Timeout  = 3000;
  };

  OGN = {
    // [dB] total receive gain. MEASURED by listening to the band, not guessed.
    //
    // This is NOT a quiet site. A 10-minute monitor of 868.3 +- 1 MHz found persistent carriers at
    // 868.09, 868.84 and 868.93 MHz, up to 78 dB above the noise floor, plus sporadic bursts that
    // reach FULL SCALE at high gain - the ADC clipped (100 %FS) twice at 70-73 dB. The band is full
    // of exactly the sort of thing expected there: sensors, remotes, meters.
    //
    // Worst single-sample peak observed per 5-minute window:
    //
    //     73 dB : 34.8 %FS and, in a longer run, 100 %FS (clipped)
    //     66 dB : 14.9 %FS
    //     63 dB : 67.7 %FS
    //     60 dB : 49.7 %FS
    //     40 dB :  0.8 %FS over 7 minutes (no loud event fell in that window)
    //
    // The spread is because the loud events are sporadic - no five-minute window is representative,
    // which is itself the finding. 63 dB is where the AD9361's own slow_attack AGC kept parking, and
    // that now makes sense: it was not being lazy, it was backing off because of this real in-band
    // energy. So 63 is a measured answer to "what gain suits this location", arrived at twice by two
    // different methods.
    //
    // 73 dB is still defensible - clipping is brief (milliseconds against 0.85 s time slots) and
    // sensitivity is what hears distant aircraft - but it does clip. The right long-term answer is a
    // software guard: watch the crest factor and saturate counter, and step this manual value down
    // when they trip, which keeps gain changes rare and reportable rather than continuous.
    //
    // THE PLUTO HAS AGC (manual / fast_attack / slow_attack / hybrid, plus ~40 tunable parameters in
    // the driver's debug attributes). It is deliberately NOT used here, and the measurement is why:
    // on this quiet band slow_attack parks around 63 dB rather than the 73 a fixed setting gives, and
    // it never settles - it dithers 62-66 dB continuously. ogn-rf measures a noise floor and
    // thresholds pulses against it, so a reference moving +-2 dB between time slots is disqualifying.
    // AGC is right for surveying (-g auto|fast|hybrid) and as anti-overload protection; for the
    // latter, prefer a software guard that steps THIS manual gain down when the crest factor
    // collapses, which changes gain rarely and explicitly instead of continuously.
    //
    // S/N was measured properly (Welch spectrum, input-referred noise = noise density - gain, 3
    // repeats, reproducible to 0.05 dB). The noise figure saturates: the last 18 dB of gain buys
    // 2.25 dB of sensitivity and the last 3 dB buys 0.20 dB. So 73 is the best available and there
    // is no penalty on a quiet band - but there is nothing above ~70 dB to chase either, and the
    // peak sample at 100 MHz already reaches 86 % of full scale there. If a strong interferer turns
    // up near 868 MHz, back the gain off; the crest factor is the tell.
    //
    // The measured sweep at 868.400 MHz (docs/hardware.md has the table):
    //
    //     gain   0 -> rms 0.2 %FS      gain  50 -> rms 0.2 %FS
    //     gain  10 -> rms 0.1 %FS      gain  60 -> rms 0.3 %FS
    //     gain  20 -> rms 0.1 %FS      gain  70 -> rms 0.6 %FS
    //     gain  30 -> rms 0.1 %FS      gain  73 -> rms 0.9 %FS, crest 4.75, nothing clipped
    //     gain  40 -> rms 0.1 %FS
    //
    // Two things follow. The law is NOT 1 dB per dB - the gain is staged inside the chip, so the
    // single number the driver exposes is not linear in it. And there is nothing to clip: at
    // maximum gain the noise floor is 0.9 %FS on this site, so maximum is simply the right answer.
    // A crest factor near 4.5 here is normal for a Gaussian noise floor, NOT compression; the
    // RSPduo's "9-11 healthy, 3-5 folding" figure came from a different measurement.
    //
    // Revisit this when an antenna with gain, or an LNA, is in the chain - 73 dB will then clip.
    Gain     = 63.0;
    GainMode = 1;                 // 1 = manual gain, as ogn-rf requires
    // How much of each second is read. The default leaves room for the demodulator; raise SensTime
    // only if ogn-rf prints "Half time slot".
    SensTime  = 0.850;            // [sec]
    StartTime = 0.375;            // [sec] offset into the time slot at which reading begins
  };
};

// Receiver identity. APRS.Call becomes the prefix of any recorded file, and is what the OGN
// network knows the station by, so set it to the callsign OGN assigned to this receiver.
APRS = {
  Call = "PlutoSDR";
};

// Position, in degrees; positive is north and east. ogn-rf uses this to pick a hopping plan when
// RF.FreqPlan is left at 0. With an explicit FreqPlan above it is informational, but keep it
// right: it is embedded in the data the receiver reports.
Position = {
  Latitude  =  52.000000;
  Longitude =   0.000000;
};

// The HTTP status page. This is the quickest way to see whether the receiver is healthy, and it is
// where the radio's own name appears - it should read "PlutoSDR" once the backend is in.
HTTP = {
  Port = 8095;
};
